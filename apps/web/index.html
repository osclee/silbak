<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Silbak — a daily deduction game. Rank six gorillas from silverback to omega in six guesses."
    />
    <!-- --paper (tokens.css). This is the page ground the app actually renders
         on; it was #0D1913 — the dark palette retired in v0.7 — which painted
         mobile browser chrome near-black above a cream page. -->
    <meta name="theme-color" content="#FBEFD3" />
    <link rel="canonical" href="https://silbak.io/" />
    <!-- One rung's portrait as the mark — see public/favicon.svg. The SVG is the
         source of truth and every current browser prefers it; the PNGs are the
         Safari < 16.4 and iOS home-screen fallbacks, regenerated by
         `pnpm --filter @silbak/web icons`. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link preview. A daily game grows by being pasted into group chats, so
         the unfurled card is the front door for most people who ever see it.
         og:image is public/og.png, rendered from the real wordmark and palette
         by `pnpm --filter @silbak/web icons` — 1200x630, the size every
         platform crops from. Absolute URLs are required here: Slack, iMessage
         and Twitter resolve these without a document base. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Silbak" />
    <meta property="og:url" content="https://silbak.io/" />
    <meta property="og:title" content="Silbak — the daily troop" />
    <meta
      property="og:description"
      content="Rank six gorillas from silverback to omega. One troop a day, six guesses, no account."
    />
    <meta property="og:image" content="https://silbak.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Silbak — six gorillas ranked on a ladder." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Silbak — the daily troop" />
    <meta
      name="twitter:description"
      content="Rank six gorillas from silverback to omega. One troop a day, six guesses, no account."
    />
    <meta name="twitter:image" content="https://silbak.io/og.png" />

    <title>Silbak — the daily troop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
